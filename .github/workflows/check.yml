name: Check InsureLens

on:
  push:
    branches: [main, feature/aura-pdf-implementation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check dist/engine.js
          node --check dist/app.js
          node --check dist/charts.js
          node --check server.mjs
          node --check llm.mjs
          node --check dist/aura.js
      - name: Install test-only dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run analysis, chart and UI tests
        run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run relational analysis and API tests
        run: python -m pytest tests/test_aura.py tests/test_aura_api.py -q
